# zizmor configuration for ortus
#
# Pin policy: every `uses:` is pinned to a full commit SHA with the exact
# version as a trailing comment (`actions/checkout@<sha> # v7.0.1`).
# Dependabot updates both the SHA and the comment, so SHA-pinning costs no
# update automation. A tag is mutable — whoever controls the action repo can
# move it — and a Dependabot PR here is auto-merged and auto-released without
# a human in the loop (dependabot-auto-merge.yml, auto-release.yml), so a
# moved tag would ship straight into a signed release.
#
# unpinned-uses therefore runs with zizmor's default policy (hash-pin for
# everything). Do not reintroduce a `"*": ref-pin` wildcard: it turns the
# only high-severity audit this repo can trip into a no-op and the weekly
# gate can then never fail.
#
# artipacked is enabled too: checkouts set `persist-credentials: false`.
# The one job that needs the persisted token (update-skills-submodule.yml:
# private submodule fetch + branch push) carries an inline ignore with
# its reason.
#
# See https://docs.zizmor.sh/configuration/

rules:
  # Dependabot cooldown would delay security rebuilds: the docker ecosystem
  # runs daily precisely so a patched spatialite-base-image reaches a release
  # within a day (see dependabot.yml). A cooldown defeats that. The
  # github-actions and gomod ecosystems are weekly and grouped, which already
  # gives new releases several days to be yanked before we pick them up.
  dependabot-cooldown:
    disable: true
