# Docker Release Pipeline für ortus
# Builds and pushes multi-arch Docker images to GitHub Container Registry.
#
# Each architecture is built natively (ubuntu-latest for amd64,
# ubuntu-24.04-arm for arm64 — no QEMU emulation), pushed as a per-arch
# candidate tag (`<variant>-ci-<arch>`), and merged into the final multi-arch
# manifests with `docker buildx imagetools create`. The merged manifest is
# what gets signed (cosign keyless).
#
# The mutable `<variant>-ci-<arch>` candidate tags are CI-internal; the
# concurrency group below serializes runs so candidates cannot be overwritten
# between build and merge.
name: Docker Release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Force push even if no changes'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Default is least-privilege; jobs add what they specifically need
# (packages:write for image push, security-events:write for SARIF
# upload, contents:write for the GitHub release).
permissions:
  contents: read

jobs:
  # =============================================================================
  # Read Version
  # =============================================================================
  version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@v7

      - name: Read VERSION file
        id: version
        run: |
          # First whitespace-delimited token of line 1 — ignores the
          # release-please marker comment (`0.13.0 # x-release-please-version`).
          VERSION=$(head -n1 VERSION | awk '{print $1}')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT

          echo "Version: $VERSION"
          echo "Major: $MAJOR"
          echo "Minor: $MINOR"

  # =============================================================================
  # Build each variant natively per architecture (no QEMU) and push per-arch
  # candidate tags
  # =============================================================================
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: [version]
    permissions:
      contents: read
      packages: write    # push image to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        variant: [alpine, ubuntu]
        include:
          - variant: alpine
            dockerfile: Dockerfile
          - variant: ubuntu
            dockerfile: Dockerfile.ubuntu
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action only supplies the OCI labels here; the candidate tag
      # is CI-internal and replaced by the final tags in the merge job.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.variant }}-ci-${{ matrix.arch }}

      - name: Build and push per-arch candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.variant }}-${{ matrix.arch }}
          # Supply-chain attestations baked into the image manifest; the
          # imagetools merge below carries them into the final manifest list.
          provenance: mode=max # SLSA build provenance
          sbom: true           # SPDX SBOM
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

  # =============================================================================
  # Merge the per-arch candidates into the final multi-arch manifests and sign
  # =============================================================================
  merge:
    name: Merge and Sign ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs: [build, version]
    permissions:
      contents: read
      packages: write
      id-token: write    # cosign keyless signing via OIDC
    strategy:
      matrix:
        variant: [alpine, ubuntu]
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same final tag sets as before the native-arm64 split: the alpine
      # variant carries the default tags (latest, X.Y.Z, X.Y, X, sha), the
      # ubuntu variant its -ubuntu counterparts.
      - name: Extract metadata (alpine tags)
        id: meta-alpine
        if: matrix.variant == 'alpine'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.version }}-alpine
            type=raw,value=${{ needs.version.outputs.minor }}
            type=raw,value=${{ needs.version.outputs.minor }}-alpine
            type=raw,value=${{ needs.version.outputs.major }}
            type=raw,value=${{ needs.version.outputs.major }}-alpine
            type=raw,value=latest
            type=raw,value=alpine
            type=sha,prefix=

      - name: Extract metadata (ubuntu tags)
        id: meta-ubuntu
        if: matrix.variant == 'ubuntu'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}-ubuntu
            type=raw,value=${{ needs.version.outputs.minor }}-ubuntu
            type=raw,value=${{ needs.version.outputs.major }}-ubuntu
            type=raw,value=ubuntu

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VARIANT: ${{ matrix.variant }}
          TAGS: ${{ matrix.variant == 'alpine' && steps.meta-alpine.outputs.tags || steps.meta-ubuntu.outputs.tags }}
        run: |
          set -euo pipefail
          args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && args="$args -t $tag"
          done <<< "$TAGS"
          # shellcheck disable=SC2086
          docker buildx imagetools create $args \
            "${IMAGE}:${VARIANT}-ci-amd64" \
            "${IMAGE}:${VARIANT}-ci-arm64"

      - name: Sign image (cosign keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REF: ${{ matrix.variant == 'alpine' && needs.version.outputs.version || format('{0}-ubuntu', needs.version.outputs.version) }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${REF}" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "${IMAGE}@${DIGEST}"

  # =============================================================================
  # Security Scan Published Images
  # =============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [merge, version]
    permissions:
      contents: read
      security-events: write   # upload Trivy SARIF
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # =============================================================================
  # Create GitHub Release (optional, on tag)
  # =============================================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [merge, version]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check if release exists
        id: check
        run: |
          if gh release view "v${{ needs.version.outputs.version }}" &> /dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog for version
        if: steps.check.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # Extract the body of this version's section: lines AFTER the
          # `## [VERSION]` heading up to (but not including) the NEXT `## [`
          # heading. (The old `/start/,/end/` range used `/## \[/` as the end
          # pattern, which matched the start heading itself, collapsing the
          # range to one line and yielding empty notes.)
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md | head -100)
          if [[ -z "$NOTES" ]]; then
            NOTES="Release v$VERSION"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Release v${{ needs.version.outputs.version }}
          body: |
            ## Docker Images

            ```bash
            # Alpine (default, recommended)
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}

            # Ubuntu
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}-ubuntu
            ```

            ## Supply chain

            Both images (Alpine and `-ubuntu`) are signed (cosign keyless) and
            carry SLSA provenance + SPDX SBOM attestations. The commands below
            use the default Alpine tag; substitute the `-ubuntu` tag to verify
            that image the same way.

            ```bash
            IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}

            # Verify the signature
            cosign verify "$IMG" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/.github/workflows/docker-release.yml@'

            # Inspect SBOM / provenance attestations
            cosign download sbom "$IMG"
            docker buildx imagetools inspect "$IMG" --format '{{ json .Provenance }}'
            ```

            ## Changelog

            ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
