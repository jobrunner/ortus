# Release automation via release-please.
#
# On every push to master, release-please inspects the Conventional Commits
# since the last release and maintains a "release PR" that:
#   - bumps the VERSION file (generic updater, x-release-please-version marker),
#   - cuts CHANGELOG.md ([Unreleased]-style accumulation → a versioned section),
#   - and, when merged, tags vX.Y.Z + creates the GitHub Release.
#
# The deliverables are the signed container images built by docker-release.yml
# (Alpine and -ubuntu). There are no standalone binaries: ortus needs CGO for
# SpatiaLite (go-sqlite3) plus mod_spatialite at runtime, and the former
# goreleaser builds (CGO_ENABLED=0) only produced stubs that exited at startup.
name: release-please

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release PR, tag, and GitHub Release
      pull-requests: write   # open/maintain the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Mint an installation token from the release GitHub App (secrets
      # RELEASE_PLEASE_APP_CLIENT_ID / RELEASE_PLEASE_APP_KEY). Unlike the default
      # GITHUB_TOKEN, pushes and PRs made with an app token DO trigger
      # workflows — so the release PR gets its required status checks instead
      # of sitting permanently BLOCKED at "0 of 18 checks" (GitHub's
      # loop-prevention only exempts the built-in GITHUB_TOKEN). The app needs
      # Contents + Pull requests read/write on this repo. Token is scoped to
      # this repository (the action's default).
      #
      # client-id, not app-id: both identify the same app, but the action
      # deprecated app-id in v3. The private key is unchanged either way.
      #
      # The permission-* inputs narrow the token to what release-please
      # actually does. Without them it inherits every permission the app's
      # installation holds, which is far more than this job needs — zizmor's
      # `github-app` audit flags exactly that.
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          permission-contents: write      # commit the release PR, push the tag, create the release
          permission-pull-requests: write # open and update the release PR

      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
